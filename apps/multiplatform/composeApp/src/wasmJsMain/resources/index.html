<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Learning</title>
    <style>
        html, body, #composeTarget {
            height: 100%;
            margin: 0;
        }
        #composeTarget { position: relative; overflow: hidden; }
        .native-auth-input {
            box-sizing: border-box;
            position: absolute;
            z-index: 1;
            border: 1px solid #cac4d0;
            border-radius: 4px;
            background: #141218;
            color: #e6e0e9;
            font: 16px system-ui, sans-serif;
            padding: 0 16px;
        }
        .native-auth-input:focus { outline: 2px solid #d0bcff; outline-offset: -2px; }
        .native-auth-input-action { position: absolute; z-index: 2; border: 0; background: transparent; color: #d0bcff; }
    </style>
</head>
<body>
    <div id="composeTarget"></div>
    <script>globalThis.__ALGORITHM_LEARNING_API_BASE_URL__ = "${apiBaseUrl}";</script>
    <script type="application/javascript" src="composeApp.js"></script>
    <script>
        const composeTarget = document.getElementById("composeTarget");
        let observedWidth = composeTarget.getBoundingClientRect().width;
        let observedHeight = composeTarget.getBoundingClientRect().height;
        new ResizeObserver(([entry]) => {
            const { width, height } = entry.contentRect;
            if (width === observedWidth && height === observedHeight) return;
            observedWidth = width;
            observedHeight = height;
            window.dispatchEvent(new Event("resize"));
        }).observe(composeTarget);
    </script>
</body>
</html>
