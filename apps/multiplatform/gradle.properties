kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# This client's composeApp module is a single Kotlin Multiplatform application
# (shared commonMain UI plus Android and Wasm targets). AGP 9 defaults to the new
# DSL and built-in Kotlin, which reject that layout, so opt into the documented
# AGP 9 compatibility mode. Revisit when composeApp is split into a library plus
# a plain Android application shell.
android.builtInKotlin=false
android.newDsl=false
