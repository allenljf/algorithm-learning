spring:
  application:
    name: algorithm-learning-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/algorithm_learning}
    username: ${DATABASE_USERNAME:algorithm_learning}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    include-stacktrace: never
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt-key: ${APP_JWT_KEY:development-only-signing-key-at-least-thirty-two-bytes}
    jwt-issuer: ${APP_JWT_ISSUER:algorithm-learning-api}
    jwt-audience: ${APP_JWT_AUDIENCE:algorithm-learning-client}
    refresh-hash-key: ${APP_REFRESH_HASH_KEY:development-only-refresh-key-at-least-thirty-two-bytes}
