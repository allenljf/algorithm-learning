    title: Create monorepo and reproducible toolchain skeleton
    status: completed
    depends_on: []
    parallel_group: foundation
    spec_refs: ["6.1", "9", "13.1", "14.1", "18"]
    execution_contract:
      analysis: single-agent
      test_approach: rapid
      documentation: update-docs
      ambiguity: infer
    implementation_strategy: >-
      Create only the root directory skeleton, ignore and non-secret
      configuration examples, pinned toolchain/version metadata, and entry-point
