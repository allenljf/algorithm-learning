    title: Restore full-height Wasm authentication viewport
    status: completed
    depends_on: []
    parallel_group: wasm-auth-viewport
    spec_refs: ["1", "AC-WAV-01..03", "4"]
    execution_contract: {analysis: single-agent, test_approach: tdd, documentation: update-docs, ambiguity: infer}
    implementation_strategy: >-
      Add only the entry-document viewport contract and its deterministic
      regression check so ComposeViewport receives a full-height host. Keep
      authentication behavior, shared Compose code, and API behavior unchanged.
    verification:
      - cd apps/multiplatform && ./gradlew :composeApp:verifyWasmViewport
      - cd apps/multiplatform && ./gradlew :composeApp:allTests
      - git diff --check
  - id: WAV-002
    title: Publish the verified Wasm viewport correction
    status: completed
    depends_on: [WAV-001]
    parallel_group: wasm-auth-viewport-release
    spec_refs: ["Goal", "AC-WAV-04", "Technical constraints", "Decisions and assumptions"]
    execution_contract: {analysis: single-agent, test_approach: rapid, documentation: update-docs, ambiguity: infer}
    implementation_strategy: >-
      Rebuild the committed viewport correction with the canonical public API
      origin, deploy only the existing Firebase Hosting target, and record
      public root-document evidence. Do not change Firebase configuration,
      Cloud Run, secrets, or application behavior.
    verification:
      - cd apps/multiplatform && ./gradlew :composeApp:wasmJsBrowserProductionWebpack -PapiBaseUrl=https://allenljf-algorithm.web.app
      - npx firebase-tools deploy --only hosting --project allenljf-algorithm
      - curl --fail --silent --show-error https://allenljf-algorithm.web.app | rg -F 'height: 100%'
      - git diff --check
  - id: WAV-003
    title: Synchronize Compose viewport with browser-chrome size changes
    status: completed
    depends_on: [WAV-002]
    parallel_group: wasm-auth-viewport-responsive
    spec_refs: ["Goal", "AC-WAV-01..05", "Technical constraints", "Decisions and assumptions"]
    execution_contract: {analysis: single-agent, test_approach: tdd, documentation: update-docs, ambiguity: infer}
    implementation_strategy: >-
      Observe composeTarget's box with the browser-native ResizeObserver and
      dispatch the resize event that ComposeViewport already handles. Keep the
      fix in the Wasm entry document; do not change shared UI, Cloud Run, or
      Firebase configuration.
    verification:
      - cd apps/multiplatform && ./gradlew :composeApp:verifyWasmViewport
