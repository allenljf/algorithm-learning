      NEON_DATABASE_USERNAME, and remove Cloud SQL connector flags and the
      postgres-socket-factory dependency.
    verification:
      - "python3 -c \"from pathlib import Path; t = Path('.github/workflows/gcp-production-deploy.yml').read_text(); assert 'id-token: write' in t and 'GCP_SA_KEY' not in t and 'concurrency:' in t and 'SPRING_FLYWAY_ENABLED=false' in t and 'NEON_MIGRATION_JDBC_URL' in t and 'NEON_SERVICE_JDBC_URL' in t and 'cloudSqlInstance' not in t and 'add-cloudsql-instances' not in t and 'prepareThreshold=0' in t\""
      - "python3 -c \"from pathlib import Path; t = Path('services/api/pom.xml').read_text(); assert 'postgres-socket-factory' not in t\""
