    status: completed
    depends_on: [NEO-001, GCP-002]
    parallel_group: neon-delivery-foundations
    spec_refs: ["2", "3", "4.1-4.2", "AC-NEO-02", "AC-NEO-03", "AC-NEO-04", "AC-NEO-06", "6-8"]
