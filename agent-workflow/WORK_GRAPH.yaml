    implementation_strategy: >-
      Use the pinned Flutter SDK to generate the Web/Android/iOS project
      foundation, then establish only the app composition root: Material 3
      light/dark theme tokens, English and Traditional Chinese localization, one
      GoRouter route table, a ProviderScope entry point, feature-first
      directories, and app-root widget tests. Lock compatible package versions;
      defer feature behavior and data layers.
    verification: ["cd apps/learning_app && flutter analyze", "cd apps/learning_app && flutter test"]
